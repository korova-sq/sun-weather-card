# HACS validation workflow for sun-weather-card
name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    if: false  # non necessario per i plugin (solo per le integrazioni)
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
